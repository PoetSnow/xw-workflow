# 只补缺：RabbitMQ + Postgres(pgvector)
# MySQL / Redis 你已有 → 不要起，本文件不含它们
#
# name 固定为独立项目，避免 docker compose down 误伤其它栈
name: xw-infra

# 用法：
#   cd deploy
#   docker compose -f docker-compose.infra.yml --env-file .env.infra up -d
# 停止（只停本项目）：
#   docker compose -f docker-compose.infra.yml --env-file .env.infra down

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: xw-demo-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${DEMO_RABBIT_USER:-xw}
      RABBITMQ_DEFAULT_PASS: ${DEMO_RABBIT_PASSWORD:-ChangeMe_Demo_Rabbit}
    volumes:
      - xw_demo_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: xw-demo-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DEMO_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DEMO_PG_PASSWORD:-ChangeMe_Demo_Pg}
      POSTGRES_DB: xw_agent
    volumes:
      - xw_demo_pg:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d xw_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  xw_demo_rabbit:
  xw_demo_pg:
