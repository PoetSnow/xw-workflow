# ClusterIP：集群内访问；Ingress 通过此 Service 转发
apiVersion: v1
kind: Service
metadata:
  name: xw-host-api
  namespace: xw
  labels:
    app.kubernetes.io/name: xw-host-api
    app.kubernetes.io/component: host-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xw-host-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
